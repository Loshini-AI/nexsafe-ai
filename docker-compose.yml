services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexsafe}
      POSTGRES_USER: ${POSTGRES_USER:-nexsafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexsafe} -d ${POSTGRES_DB:-nexsafe}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-nexsafe}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nexsafe}}
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      MODEL_WEIGHTS: ${MODEL_WEIGHTS:-}
      ACCIDENT_MODEL_WEIGHTS: ${ACCIDENT_MODEL_WEIGHTS:-}
      ROAD_RISK_MODEL_WEIGHTS: ${ROAD_RISK_MODEL_WEIGHTS:-}
      ROAD_RISK_POSITIVE_CLASSES: ${ROAD_RISK_POSITIVE_CLASSES:-}
    volumes:
      - uploads:/data/uploads
      - ${MODEL_WEIGHTS_HOST:-./models}:/models:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://localhost:8000/api/health', timeout=4))['status'] == 'available'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads:
